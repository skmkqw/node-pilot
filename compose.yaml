services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nodepilot-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      NODE_PILOT_DB_CONNECTION_STRING: Data Source=/app/data/nodepilot.db
      FileManager__RootPath: /files
    volumes:
      # Database (account, settings, metrics) and encryption keys survive container rebuilds.
      - nodepilot-data:/app/data
      # Directory exposed in the file manager (videos, documents, ...).
      - ${NODEPILOT_FILES_DIR:-./data/files}:/files
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Empty = the browser calls the backend on port 5000 of the same host,
        # which works from any device in the home network.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: nodepilot-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nodepilot-data:
