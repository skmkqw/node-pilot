# NodePilot behind nginx: one HTTPS address for the web app and the API.
#
#   browser ──HTTPS:443──► nginx ─┬─ /api/, /health  ──► backend http://127.0.0.1:5000
#                                 └─ everything else ──► web     http://127.0.0.1:3000
#
# Install (Debian/Ubuntu/Raspberry Pi OS):
#   sudo cp deploy/nginx/nodepilot.conf /etc/nginx/sites-available/nodepilot
#   sudo ln -s /etc/nginx/sites-available/nodepilot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (other distros: copy it to /etc/nginx/conf.d/nodepilot.conf instead)#
# The backend must run with ReverseProxy__Enabled=true, and the web app must be built with
# NEXT_PUBLIC_API_URL=/ so it calls the API on this address. See the README.

# Plain HTTP only redirects. The session cookie is marked Secure, so the panel needs HTTPS.
server {
    listen 80;
    listen [::]:80; #for IpV6
    server_name nodepilot.home;

    return 301 https://$host$request_uri;
}

# The actual server
server {
    listen 443 ssl; # Default for HTTPS
    listen [::]:443 ssl;
    http2 on; # Makes it faster
    server_name nodepilot.home;

    # Created by deploy/nginx/make-cert.sh.
    ssl_certificate     /etc/nginx/ssl/nodepilot.crt;
    ssl_certificate_key /etc/nginx/ssl/nodepilot.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # nginx rejects bodies over 1 MB by default (413). Keep this in sync with
    # FileManager:MaxUploadMegabytes (4096 by default), which the backend enforces itself.
    client_max_body_size 4096m;

    # Headers for both upstreams. X-Forwarded-For is *overwritten* with the address nginx sees,
    # not appended to: whatever a client sends in that header itself is thrown away. The backend
    # trusts the header only because the connection comes from 127.0.0.1 (ReverseProxy:KnownProxies).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        # Pass responses through as they arrive instead of buffering them in nginx, so video
        # streaming starts immediately. Range headers are forwarded as is, so seeking works.
        proxy_buffering off;
    }

    location = /api/files/upload {
        proxy_pass http://127.0.0.1:5000;

        # Stream uploads to the backend as they arrive. With buffering on, nginx would first write
        # a multi-GB video to its own temp folder, and the browser's progress bar would be wrong.
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        # WebSocket upgrade, used by `npm run dev` for hot reload. Harmless for `npm start`.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Connection: upgrade for WebSocket requests, nothing special for the rest.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
